[metadata]
name = model2ctc
version = 0.1.0
description = Stable hybrid ML and FIR crosstalk-cancellation filter design

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    numpy>=1.24

[options.extras_require]
brir =
    scipy>=1.10

[options.package_data]
BRIR =
    data/*.json

[options.entry_points]
console_scripts =
    model2ctc = Model2CTC.cli:main
