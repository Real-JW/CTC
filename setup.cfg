[metadata]
name = ctc
version = 0.1.0
description = ML-guided low-latency crosstalk cancellation reference implementation

[options]
packages = find:
python_requires = >=3.9

[options.extras_require]
brir =
    numpy>=1.24
    scipy>=1.10

[options.entry_points]
console_scripts =
    ctc = ctc.cli:main
